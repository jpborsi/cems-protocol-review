[project]
name = "ems-protocol"
version = "0.1.0"
description = "AI-powered review of EMS protocols"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "argparse>=1.4.0",
    "claude-agent-sdk>=0.1.66",
    "deepeval>=3.9.7",
    "dotenv>=0.9.9",
    "google-genai>=1.73.1",
    "openai>=2.32.0",
    "pycryptodome>=3.23.0",
    "pypdf>=6.10.2",
    "pyyaml>=6.0.3",
    "xai-sdk>=1.11.0",
]

[build-system]
requires = ["uv_build>=0.10.8,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.15.9",
    "pytest>=9.0.2"
]
